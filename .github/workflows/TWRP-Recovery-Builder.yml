name: TWRP Recovery Builder
# Credits to:
# https://github.com/TeamWin
# https://gitlab.com/OrangeFox
# https://github.com/azwhikaru for Recovery Builder Template
# https://github.com/carlodandan for Recovery Builder Template
# And all Contributors in every repositories I used
on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'TWRP Manifest'
        required: true
        default: 'https://github.com/VastCoreOS3/TWRP-Manifest'
      MANIFEST_BRANCH:
        description: 'TWRP Manifest Branch'
        required: true
        default: 'twrp-12.1'
      DEVICE_TREE:
        description: 'TWRP Device Tree'
        required: true
        default: 'https://github.com/VastCoreOS3/TWRP-Device-Tree.git'
      DEVICE_TREE_BRANCH:
        description: 'TWRP Device Tree Branch'
        required: true
        default: 'twrp-12.1'
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/xiaomi/alioth'
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'alioth'
      MAKEFILE_NAME:
        description: 'Specify your Device Makefile Name'
        required: true
        default: 'twrp_alioth'
        type: choice
        options:
        - twrp_alioth
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'boot'
        type: choice
        options:
        - boot
      USE_CCACHE:
        description: Use ccache for compilation
        type: boolean
        required: true
        default: true
jobs:
  build:
    name: Build TWRP by ${{ shturl.cc/FK }}
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TZ: Asia/Shanghai
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12
    - name: Install Build Dependencies
      run: |
        sudo apt update
        sudo apt install aria2 git python3 python-is-python3 -y
        git clone https://github.com/akhilnarang/scripts.git -b master
        cd scripts
        sudo bash setup/android_build_env.sh
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      if: inputs.USE_CCACHE
      with:
        max-size: "10G"
        key: ${{ runner.os }}-${{ inputs.MANIFEST_BRANCH }}-${{ inputs.MAKEFILE_NAME }}
        cache-dir: ${{ env.CCACHE_DIR }}
    - name: Init & Sync Manifest
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/twrp
        cd ${GITHUB_WORKSPACE}/twrp
        git config --global user.name "${{ shturl.cc/FK }}"
        git config --global user.email "${{ shturl.cc/FK_id }}+${{ shturl.cc/FK }}@users.noreply.github.com"
        repo init --depth=1 -u ${{ inputs.MANIFEST_URL }} -b ${{ inputs.MANIFEST_BRANCH }}
        repo sync -j$(nproc --all) -c --no-clone-bundle --force-sync
    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/twrp
        rm -rf ./${{ inputs.DEVICE_PATH }}
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
    - name: Build TWRP
      run: |
        cd ${GITHUB_WORKSPACE}/twrp
        if [[ ${{ inputs.USE_CCACHE }} == true ]]; then
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          sed -i 's/return sandboxConfig\.working/return false/g' build/soong/ui/build/sandbox_linux.go
        fi
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ inputs.MAKEFILE_NAME }}-eng
        mka clean
        mka ${{ inputs.BUILD_TARGET }}image -j$(nproc --all)
    - name: Set Release Vars
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        echo "BUILD_TARGET_NAME=boot" >> $GITHUB_ENV
    - name: Check Image Exists
      id: checkimg
      run: |
        IMG_PATH=${GITHUB_WORKSPACE}/twrp/out/target/product/${{ inputs.DEVICE_NAME }}/${{ env.BUILD_TARGET_NAME }}.img
        if [ -f "$IMG_PATH" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          exit 1
        fi
    - name: Upload Release
      uses: softprops/action-gh-release@v2
      if: steps.checkimg.outputs.exists == 'true'
      with:
        files: |
          twrp/out/target/product/${{ inputs.DEVICE_NAME }}/${{ env.BUILD_TARGET_NAME }}.img
          twrp/out/target/product/${{ inputs.DEVICE_NAME }}/*.zip
        name: Unofficial TWRP ${{ env.BUILD_TARGET_NAME }} for ${{ inputs.DEVICE_NAME }} | ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        generate_release_notes: false
        body: |
          ## Unofficial TWRP Build
          - Manifest Branch: `${{ inputs.MANIFEST_BRANCH }}`
          - Device Tree: [Link](${{ inputs.DEVICE_TREE }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          - Device Tree Commit: [${{ env.COMMIT_ID }}](${{ inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }})
          - Build Target: `${{ env.BUILD_TARGET_NAME }}.img`
